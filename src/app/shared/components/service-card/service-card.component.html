<article
  class="service-card"
  (click)="open()"
  (keydown.enter)="open()"
  (keydown.space)="open()"
  role="button"
  tabindex="0"
  [attr.aria-label]="('common.details' | translate) + ' ' + card().name"
>
  <div class="card-icon">
    <img [src]="card().icon" alt="" width="34" height="34" loading="lazy">
  </div>
  <h3 class="card-name">{{ card().name }}</h3>
  <p class="card-teaser">{{ card().teaser }}</p>
  <a
    class="card-link"
    [routerLink]="['/servicii-funerare', card().slug]"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
  >{{ 'common.learnMore' | translate }} →</a>
</article>
