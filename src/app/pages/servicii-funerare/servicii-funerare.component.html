<section class="page-hero">
  <div class="container">
    <h1 class="page-hero-title reveal-hidden">{{ 'services.title' | translate }}</h1>
    <p class="page-hero-desc reveal-hidden">
      {{ 'services.desc' | translate }}
    </p>
  </div>
</section>

<section class="services-section">
  <div class="container">
    <div class="services-grid">
      @for (service of services; track service.slug) {
        <pax-service-card
          [card]="service"
          (openModal)="openModal($event)"
          paxRevealOnScroll
        />
      }
    </div>
  </div>
</section>

<section class="cta-banner" paxRevealOnScroll>
  <div class="container cta-inner">
    <div>
      <h2>{{ 'ctaBanner.title' | translate }}</h2>
      <p>{{ 'ctaBanner.text' | translate }}</p>
    </div>
    <a href="tel:0745547530" class="cta-btn-primary">☎ {{ 'common.phone' | translate }}</a>
  </div>
</section>

<pax-service-detail-modal
  [service]="activeService()"
  (closed)="closeModal()"
/>
